name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install packwiz and pytest
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          pip install pytest

      # Nothing is uploaded unless the released commits and the pack pass the same checks as the branch build.
      - name: Commit format
        run: python -m tools.checks.commit_check --release "$GITHUB_REF_NAME"

      - name: Tests
        run: python -m pytest

      - name: Quest book matches its sources
        run: |
          python -m tools.questgen.generate
          git diff --exit-code -- config/ftbquests

      - name: Version from the tag
        run: echo "PACK_VERSION=$(python -m tools.publish --tag "$GITHUB_REF_NAME" --check)" >> "$GITHUB_ENV"

      - name: Public build
        shell: pwsh
        run: ./tools/build.ps1 -Public -Version $env:PACK_VERSION

      - name: Upload to CurseForge
        env:
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python -m tools.publish --tag "$GITHUB_REF_NAME"
