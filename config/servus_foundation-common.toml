#Whether the Configuration Carrot rotates blocks that do not handle the wrench role themselves.
[wrench]
	wrenchRotatesBlocks = true

#How many blocks a sneak click may walk along a run of rails or ducts to place at its end.
[placement]
	# Default: 16
	# Range: 1 ~ 64
	placementAssistReach = 16

#How many chunks one team may keep loaded at the same time with Ender Anchors and woken warehouse sites.
#A chunk held by several of them counts once.
[enderAnchor]
	# Default: 49
	# Range: 1 ~ 1024
	maxLoadedChunksPerTeam = 49
	#When FTB Chunks is installed, Servus Ender Anchors stay inactive and point players to FTB Chunks.
	enderAnchorRespectsFtbChunks = true
