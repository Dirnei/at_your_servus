[chapter]
title = "Prologue: Arrival"
subtitle = "A meadow above Berchtesgaden"
icon = "minecraft:oak_door"

[[quest]]
slug = "first-letter"
title = "A Letter from the Notary"
subtitle = "Servus, kid"
description = """
Servus, kid,

I want you to take my land. I would have given you my house, but there is none anymore. The house went down into the mountain, with the workshop and the cellar. I dug too deep. Sorry about that.

The land is yours now. I am away. Do not ask me where. I will write to you later.

Uncle Vinzenz"""
x = 0.0
y = 0.0
shape = "gear"
size = 1.5
tasks = [{ type = "checkmark" }]
rewards = [{ type = "item", item = "minecraft:wheat_seeds", count = 8 }, { type = "item", item = "minecraft:carrot", count = 8 }, { type = "item", item = "minecraft:potato", count = 8 }]

[[quest]]
slug = "workbench"
title = "Something to Work On"
description = """
Best to punch some trees and start with a workbench. You will need it to make the tools for digging a new mine."""
x = 2.0
y = 0.0
deps = ["first-letter"]
tasks = [{ type = "item", item = "minecraft:crafting_table" }]
rewards = [{ type = "item", item = "minecraft:torch", count = 16 }]

[[quest]]
slug = "bench-on-a-stick"
title = "A Bench to Go"
description = """
When I walked the mountains I carried a workbench on a stick. People laughed. Then they borrowed it."""
x = 2.0
y = -2.0
deps = ["workbench"]
tasks = [{ type = "item", item = "crafting_on_a_stick:crafting_table" }]
rewards = [{ type = "xp", amount = 20 }]

[[quest]]
slug = "fire"
title = "A Fire in the Stove"
description = """
Did you know that you can upgrade your furnace? A copper furnace is cheap up here and works faster than stone."""
x = 4.0
y = 0.0
deps = ["workbench"]
tasks = [{ type = "item", item = "minecraft:furnace" }, { type = "item", item = "ironfurnaces:copper_furnace" }]
rewards = [{ type = "item", item = "minecraft:coal", count = 16 }]

[[quest]]
slug = "food"
title = "Something to Eat"
description = """
Plant some seeds early. A Bavarian who works on an empty stomach works badly and complains well."""
x = 6.0
y = 2.0
deps = ["bed"]
tasks = [{ type = "item", item = "minecraft:bread", count = 8 }]
rewards = [{ type = "item", item = "minecraft:cooked_beef", count = 8 }]

[[quest]]
slug = "iron-pick"
title = "Iron from the Hill"
description = """
The mountain is full of old holes. Some of them are mine, most of them are much older. Bring back iron and make yourself a pickaxe that does not break on the first good stone. Every vein you dig teaches your hands something. Press K and see what they learned."""
x = 6.0
y = 0.0
deps = ["fire"]
tasks = [{ type = "item", item = "minecraft:iron_pickaxe" }]
rewards = [{ type = "item", item = "minecraft:iron_ingot", count = 8 }, { type = "skill_points", tree = "miner", amount = 1 }]

[[quest]]
slug = "backpack"
title = "A Bag for the Road"
description = """
A backpack saves you a lot of walking. Trust me, take one."""
x = 4.0
y = -2.0
deps = ["workbench"]
optional = true
tasks = [{ type = "item", item = "sophisticatedbackpacks:backpack" }]
rewards = [{ type = "item", item = "minecraft:leather", count = 4 }]

[[quest]]
slug = "waystone"
title = "The Way Home"
description = """
The mountains are big and my legs were never young enough for them. A warp stone takes you back to any waystone you have found. Walking teaches you too."""
x = 6.0
y = -2.0
deps = ["iron-pick"]
tasks = [{ type = "item", item = "waystones:warp_stone" }]
rewards = [{ type = "item", item = "minecraft:ender_pearl", count = 2 }, { type = "skill_points", tree = "wanderer", amount = 1 }]

[[quest]]
slug = "bed"
title = "A Place to Sleep"
description = """
My bed went down with the house, and it was too short for anyone but me anyway. Make your own, or a hammock if you like to sleep through the day."""
x = 4.0
y = 2.0
deps = ["workbench"]
tasks = [{ type = "item", item = "minecraft:white_bed" }]
rewards = [{ type = "item", item = "comforts:hammock_white" }]

[[quest]]
slug = "settled"
title = "Settled In"
subtitle = "On to the works"
description = """
Servus, kid,

I heard you have settled in on the land I gave you.

Now you should build a place for all the machines. Don't make it too small, you will need the room!

Uncle Vinzenz"""
x = 8.0
y = 0.0
shape = "gear"
size = 1.25
deps = ["iron-pick", "food"]
tasks = [{ type = "checkmark" }]
rewards = [{ type = "xp", amount = 50 }]
