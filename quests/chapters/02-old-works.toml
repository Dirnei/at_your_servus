[chapter]
title = "The Works"
subtitle = "Ducts, steam and a first warehouse"
icon = "servus_foundation:item_pipe"

[[quest]]
slug = "works-letter"
title = "New Works"
subtitle = "To be opened in the works"
description = """
Servus, kid,

my old works had a water wheel, a steam engine and pipes that went everywhere and nowhere. All gone now. Good riddance to the pipes.

Pipes were always a mess, so I came up with one duct that carries everything: items, power, fluids and, later, orders.
You have to find a carrot, some redstone and an iron ingot. Trust me. Here is the plan for it.

Uncle Vinzenz"""
x = 0.0
y = 0.0
shape = "gear"
size = 1.5
deps = ["arrival:settled"]
tasks = [{ type = "checkmark" }]
rewards = [{ type = "item", item = "minecraft:copper_ingot", count = 16 }]

[[quest]]
slug = "carrot"
title = "The Configuration Carrot"
description = """
It turns blocks, sets sides and takes things apart. Every engineer needs a tool he can eat in an emergency. I never had to."""
x = 2.0
y = 0.0
deps = ["works-letter"]
tasks = [{ type = "item", item = "servus_foundation:configuration_carrot" }]
rewards = [{ type = "xp", amount = 20 }]

[[quest]]
slug = "goggles"
title = "Engineer's Goggles"
description = """
Put these on and you can see what flows through a duct. I wore mine to dinner once. Nobody said anything, but they all looked."""
x = 2.0
y = -2.0
deps = ["carrot"]
optional = true
tasks = [{ type = "item", item = "servus_foundation:engineer_goggles" }]
rewards = [{ type = "xp", amount = 20 }]

[[quest]]
slug = "duct"
title = "One Duct for Everything"
description = """
Place an Item Pipe and put a fluid pipe or a power cable into the same block and the duct carries both. One duct, many lines, no mess.

The item line moves things from one inventory to the next, like from a chest into a furnace."""
x = 4.0
y = 0.0
deps = ["carrot"]
tasks = [{ type = "item", item = "servus_foundation:item_pipe", count = 16 }]
rewards = [{ type = "item", item = "minecraft:chest", count = 2 }]

[[quest]]
slug = "fluid-line"
title = "Water Where You Want It"
description = """
You need a fluid line, a tank and a pump. The burner pump runs on coal. That is good enough until you have power."""
x = 6.0
y = -1.0
deps = ["duct"]
tasks = [{ type = "item", item = "servus_foundation:fluid_pipe", count = 8 },
         { type = "item", item = "servus_foundation:fluid_tank" },
         { type = "item", item = "servus_foundation:burner_pump" }]
rewards = [{ type = "item", item = "minecraft:bucket", count = 2 }]

[[quest]]
slug = "coal-generator"
title = "Steam Again"
description = """
The Coal Generator is not clever, but it is honest. Coal goes in, power comes out."""
x = 6.0
y = 1.0
deps = ["duct"]
tasks = [{ type = "item", item = "servus_foundation:coal_generator" }]
rewards = [{ type = "item", item = "minecraft:coal_block", count = 4 }]

[[quest]]
slug = "power-line"
title = "Power Down the Line"
description = """
Put a power line in the duct and the generator's power goes wherever the duct goes."""
x = 8.0
y = 1.0
deps = ["coal-generator"]
tasks = [{ type = "item", item = "servus_foundation:power_cable", count = 8 }]
rewards = [{ type = "xp", amount = 30 }]

[[quest]]
slug = "warehouse-letter"
title = "A Merchant Needs a Warehouse"
subtitle = "To be opened when the generator runs"
description = """
Servus, kid,

our family were traders long before we were miners. Huber & Co., since 1521. We carried salt from Berchtesgaden to Salzburg and Augsburg. A merchant without a warehouse is just a peddler.

I wanted to bring the company back. I only got as far as a few racks but i invented a little shuttle that runs on rails. Start there. Racks first, then the rails, then the shuttle.

Uncle Vinzenz"""
x = 4.0
y = 4.0
shape = "gear"
size = 1.5
deps = ["coal-generator"]
tasks = [{ type = "checkmark" }]
rewards = [{ type = "item", item = "minecraft:iron_ingot", count = 16 }]

[[quest]]
slug = "racks"
title = "Heavy Duty Racks"
description = """
Racks hold the goods. They are made for shuttles, not for you, so put them along a rail."""
x = 6.0
y = 4.0
deps = ["warehouse-letter"]
tasks = [{ type = "item", item = "servus_shuttles:heavy_rack", count = 4 }]
rewards = [{ type = "item", item = "minecraft:iron_ingot", count = 8 }]

[[quest]]
slug = "rails"
title = "Warehouse Rails"
description = """
Lay the rails in front of the racks. Sneak-click a rail with rails in your hand and the new one goes on the far end of the line."""
x = 8.0
y = 4.0
deps = ["racks"]
tasks = [{ type = "item", item = "servus_shuttles:rail", count = 16 }]
rewards = [{ type = "item", item = "servus_shuttles:rail", count = 8 }]

[[quest]]
slug = "shuttle"
title = "The First Shuttle"
description = """
Put a garage at the end of the rails and a Mk1 shuttle in it. It needs no power. It just runs, like a good dog."""
x = 10.0
y = 4.0
deps = ["rails"]
tasks = [{ type = "item", item = "servus_shuttles:shuttle_garage" },
         { type = "item", item = "servus_shuttles:shuttle" }]
rewards = [{ type = "xp", amount = 50 }]

[[quest]]
slug = "elevator"
title = "Up and Down"
description = """
A rail elevator takes the shuttle up to the next floor. Build your warehouse tall, it saves you a lot of walking."""
x = 10.0
y = 6.0
deps = ["shuttle"]
optional = true
tasks = [{ type = "item", item = "servus_shuttles:elevator" }]
rewards = [{ type = "xp", amount = 30 }]

[[quest]]
slug = "controller"
title = "The Warehouse Controller"
description = """
The controller sits on the rails and runs the whole warehouse. It needs  and redistributes the power, so run a power line from the Coal Generator to it."""
x = 12.0
y = 4.0
deps = ["shuttle", "power-line"]
tasks = [{ type = "item", item = "servus_shuttles:warehouse_controller" }]
rewards = [{ type = "item", item = "minecraft:coal_block", count = 4 }]

[[quest]]
slug = "data-cable"
title = "The Data Cable"
description = """
Only storage goes on the rails. Everything else talks over the data cable. The controller sits on both, so run a cable from the controller to wherever you want your terminal."""
x = 14.0
y = 4.0
deps = ["controller"]
tasks = [{ type = "item", item = "servus_foundation:data_cable", count = 16 }]
rewards = [{ type = "item", item = "servus_foundation:data_cable", count = 16 }]

[[quest]]
slug = "packing-station"
title = "The Warehouse Door"
description = """
The Packing Station is the door between the racks and the data cable. Put it next to the rails and on the data cable. Everything you take out at a terminal leaves the racks through it, and everything you put in comes back the same way."""
x = 16.0
y = 4.0
deps = ["data-cable"]
tasks = [{ type = "item", item = "servus_shuttles:packing_station" }]
rewards = [{ type = "xp", amount = 50 }]

[[quest]]
slug = "terminal"
title = "One Window on Everything"
subtitle = "A warehouse, at last"
description = """
Servus, kid,

a Storage Terminal on the data cable shows you everything in stock. Ask for something and the shuttles bring it to you. Put something in and the shuttles put it away. That is a warehouse.

Next you need food and a cellar. Put the fields to work, then dig yourself a cellar. Not too deep. Learn from me.

Uncle Vinzenz"""
x = 18.0
y = 4.0
shape = "gear"
size = 1.25
deps = ["packing-station"]
tasks = [{ type = "item", item = "servus_shuttles:storage_terminal" }]
rewards = [{ type = "item", item = "servus_shuttles:heavy_rack", count = 4 }, { type = "skill_points", tree = "wanderer", amount = 1 }]
