[chapter]
title = "The Power Station"
subtitle = "Coal is not enough for a trading company"
icon = "powah:energizing_orb"

[[quest]]
slug = "power-letter"
title = "Plans for a Power Station"
subtitle = "To be opened when the coal runs low"
description = """
Servus, kid,

a warehouse eats a lot of power, and the cellar will too. The Coal Generator was never meant to last. Here are my plans for a real power station.

It runs on crystals, because the old way is too slow. Don't ask me how the crystals work. I only know that they do.

Uncle Vinzenz"""
x = 0.0
y = 0.0
shape = "gear"
size = 1.5
deps = ["old-works:terminal"]
tasks = [{ type = "checkmark" }]
rewards = [{ type = "item", item = "minecraft:redstone_block", count = 2 }]

[[quest]]
slug = "dielectric"
title = "Dielectric Paste"
description = """
Everything in the station starts with dielectric paste. Clay, charcoal and a bit of lava. It's messy, but it holds."""
x = 2.0
y = 0.0
deps = ["power-letter"]
tasks = [{ type = "item", item = "powah:dielectric_paste", count = 16 }]
rewards = [{ type = "item", item = "minecraft:clay_ball", count = 16 }]

[[quest]]
slug = "orb"
title = "The Energizing Orb"
description = """
The orb charges whatever you put in it, as long as the rods give it power. Put the starter rods around it and feed them power from the duct."""
x = 4.0
y = 0.0
deps = ["dielectric"]
tasks = [{ type = "item", item = "powah:energizing_orb" },
         { type = "item", item = "powah:energizing_rod_starter", count = 2 }]
rewards = [{ type = "xp", amount = 50 }]

[[quest]]
slug = "energized-steel"
title = "Energized Steel"
description = """
Iron and gold, charged together. The whole station is built from it."""
x = 6.0
y = 0.0
deps = ["orb"]
tasks = [{ type = "item", item = "powah:steel_energized", count = 16 }]
rewards = [{ type = "item", item = "minecraft:iron_ingot", count = 16 }]

[[quest]]
slug = "furnator"
title = "A Better Fire"
description = """
The Furnator burns fuel like the Coal Generator, only much better. Connect it to the power line in the duct and the warehouse uses the power as it comes."""
x = 8.0
y = -1.0
deps = ["energized-steel"]
tasks = [{ type = "item", item = "powah:furnator_basic" }]
rewards = [{ type = "item", item = "minecraft:coal_block", count = 8 }]

[[quest]]
slug = "solar"
title = "Power from the Sky"
description = """
The sun shines up here more than people think. Put a solar panel on the roof, it pays for itself."""
x = 8.0
y = 1.0
deps = ["energized-steel"]
tasks = [{ type = "item", item = "powah:solar_panel_basic", count = 2 }]
rewards = [{ type = "xp", amount = 50 }]

[[quest]]
slug = "energy-cell"
title = "Keep It for Later"
description = """
An energy cell stores power for later, so the night shift has something to run on."""
x = 10.0
y = 0.0
deps = ["furnator"]
tasks = [{ type = "item", item = "powah:energy_cell_basic" }]
rewards = [{ type = "item", item = "powah:energy_cable_basic", count = 8 }]

[[quest]]
slug = "hardened"
title = "Hardened Parts"
description = """
Hardened capacitors and hardened rods make the orb twice as good."""
x = 12.0
y = 0.0
deps = ["energy-cell"]
tasks = [{ type = "item", item = "powah:capacitor_hardened", count = 4 },
         { type = "item", item = "powah:energizing_rod_hardened", count = 2 }]
rewards = [{ type = "xp", amount = 80 }]

[[quest]]
slug = "blazing"
title = "Blazing Crystals"
description = """
Next the orb wants blaze powder. That means going to the Nether. Read the next letter first."""
x = 14.0
y = 0.0
deps = ["hardened", "nether:blaze"]
tasks = [{ type = "item", item = "powah:crystal_blazing", count = 8 }]
rewards = [{ type = "item", item = "minecraft:blaze_rod", count = 4 }]

[[quest]]
slug = "magmator"
title = "Lava Into Power"
description = """
The Magmator turns lava into power. And the Nether has more lava than sense."""
x = 14.0
y = 2.0
deps = ["blazing"]
tasks = [{ type = "item", item = "powah:magmator_blazing" }]
rewards = [{ type = "item", item = "minecraft:lava_bucket" }]

[[quest]]
slug = "niotic"
title = "Niotic Crystals"
description = """
Diamonds, charged until they glow. Expensive, but worth it."""
x = 16.0
y = 0.0
deps = ["blazing"]
tasks = [{ type = "item", item = "powah:crystal_niotic", count = 8 }]
rewards = [{ type = "item", item = "minecraft:diamond", count = 4 }]

[[quest]]
slug = "spirited"
title = "Spirited Crystals"
description = """
Emeralds this time. At night you can hear the station hum."""
x = 18.0
y = 0.0
deps = ["niotic"]
tasks = [{ type = "item", item = "powah:crystal_spirited", count = 8 }]
rewards = [{ type = "item", item = "minecraft:emerald", count = 8 }]

[[quest]]
slug = "reactor"
title = "The Reactor"
description = """
My plans end with a reactor. You need uraninite, a lot of reactor casing and cooling. Build it as big as you dare."""
x = 20.0
y = 0.0
deps = ["spirited"]
tasks = [{ type = "item", item = "powah:reactor_spirited", count = 16 }]
rewards = [{ type = "item", item = "powah:uraninite", count = 16 }]

[[quest]]
slug = "nitro"
title = "Nitro Crystals"
subtitle = "The station is finished"
description = """
Servus, kid,

nitro crystals. I only ever made one and it took me the whole winter. If you have made a stack, the station is done and the farm has power for a hundred years.

Uncle Vinzenz"""
x = 22.0
y = 0.0
shape = "gear"
size = 1.5
deps = ["reactor"]
tasks = [{ type = "item", item = "powah:crystal_nitro", count = 8 }]
rewards = [{ type = "item", item = "powah:energy_cell_nitro" }]
