[chapter]
title = "Into the Nether"
subtitle = "Behind the burning gate"
icon = "justdirethings:blazegold_ingot"

[[quest]]
slug = "nether-letter"
title = "Behind the Burning Gate"
subtitle = "To be opened before the Nether"
description = """
Servus, kid,

the fire you need lives behind the burning gate, in the Nether. The journal says so, and so do my burns.

Do not go in iron. Down in an old shaft I found a strange green goo that eats metal and gives back something better. My notes on it are below. Go armoured, go fed, and come back.

Build the gate from obsidian and light it. Once the purple fire burns, take a good look at it.

Uncle Vinzenz"""
x = 0.0
y = 0.0
shape = "gear"
size = 1.5
tasks = [{ type = "observation", observe = "minecraft:nether_portal" }]
rewards = [{ type = "xp", amount = 50 }]

[[quest]]
slug = "goo"
title = "Primal Goo"
description = """
From my notes: "Feed it an iron block. Wait. Do not touch it while it works. Do not lick it either; once was enough."""
x = 2.0
y = 0.0
deps = ["nether-letter"]
tasks = [{ type = "item", item = "justdirethings:gooblock_tier1" }]
rewards = [{ type = "item", item = "minecraft:iron_block", count = 2 }]

[[quest]]
slug = "ferricore"
title = "Ferricore"
description = """
What the goo leaves behind smelts into ferricore: iron that has learned a few tricks."""
x = 4.0
y = 0.0
deps = ["goo"]
tasks = [{ type = "item", item = "justdirethings:ferricore_ingot", count = 16 }]
rewards = [{ type = "xp", amount = 50 }]

[[quest]]
slug = "ferricore-gear"
title = "Armour with Tricks"
description = """
Ferricore armour and tools. Put upgrades in them; that is what the tricks are for."""
x = 6.0
y = -1.0
deps = ["ferricore"]
tasks = [{ type = "item", item = "justdirethings:ferricore_chestplate" },
         { type = "item", item = "justdirethings:ferricore_pickaxe" },
         { type = "item", item = "justdirethings:ferricore_sword" }]
rewards = [{ type = "item", item = "justdirethings:upgrade_blank", count = 2 }]

[[quest]]
slug = "portal"
title = "The Gate"
description = """
Obsidian and a spark. Step through with a full belly."""
x = 6.0
y = 1.0
deps = ["ferricore"]
tasks = [{ type = "item", item = "minecraft:obsidian", count = 10 }, { type = "item", item = "minecraft:flint_and_steel" }]
rewards = [{ type = "item", item = "minecraft:golden_apple", count = 2 }]

[[quest]]
slug = "blaze"
title = "Blaze Rods"
description = """
Blazes guard the Nether fortresses. Their rods feed the power station's orb and the yellow fire in the cellar."""
x = 8.0
y = 1.0
deps = ["portal"]
tasks = [{ type = "item", item = "minecraft:blaze_rod", count = 16 }]
rewards = [{ type = "item", item = "minecraft:blaze_powder", count = 8 }]

[[quest]]
slug = "goo-2"
title = "Hungrier Goo"
description = """
From my notes: "Feed it ferricore and it wants more. Give it gold in the Nether and it gives back gold that burns."""
x = 8.0
y = -1.0
deps = ["ferricore-gear", "blaze"]
tasks = [{ type = "item", item = "justdirethings:gooblock_tier2" }]
rewards = [{ type = "item", item = "minecraft:gold_block", count = 2 }]

[[quest]]
slug = "blazegold"
title = "Blazegold"
description = """
Gold that remembers the fire. Lighter than ferricore and better in the heat."""
x = 10.0
y = -1.0
deps = ["goo-2"]
tasks = [{ type = "item", item = "justdirethings:blazegold_ingot", count = 16 }]
rewards = [{ type = "xp", amount = 80 }]

[[quest]]
slug = "blazegold-gear"
title = "Dressed for the Fire"
description = """
Blazegold armour and a blazegold sword. Now the Nether can come to you."""
x = 12.0
y = -1.0
deps = ["blazegold"]
tasks = [{ type = "item", item = "justdirethings:blazegold_chestplate" },
         { type = "item", item = "justdirethings:blazegold_sword" }]
rewards = [{ type = "item", item = "justdirethings:upgrade_blank", count = 4 }]

[[quest]]
slug = "lava-immunity"
title = "Lava Is Just Hot Water"
description = """
A lava immunity upgrade in your boots, and you can swim where the salamanders live."""
x = 12.0
y = -3.0
deps = ["blazegold-gear"]
optional = true
tasks = [{ type = "item", item = "justdirethings:upgrade_lavaimmunity" }]
rewards = [{ type = "xp", amount = 50 }]

[[quest]]
slug = "salamander"
title = "The Fire Spirit"
subtitle = "Journal: The Wandering Years"
description = """
Servus, kid,

the journal talks about a salamander, a fire spirit that lives in the Nether. With the yellow fire burning in the cellar you can bind one to a forge. I did. It sulks, but it works.

Uncle Vinzenz"""
x = 12.0
y = 1.0
shape = "gear"
size = 1.25
deps = ["blaze", "cellar:albedo"]
tasks = [{ type = "item", item = "servus_alchemy:salamander_forge" }]
rewards = [{ type = "item", item = "minecraft:magma_block", count = 8 }]
