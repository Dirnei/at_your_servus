[chapter]
title = "Building and Decor"
subtitle = "Side chapter: make the farm yours"
icon = "wands:iron_wand"

[[quest]]
slug = "wand"
title = "A Building Wand"
description = """
Rows of blocks with one click. Uncle Vinzenz would have built the house twice with one of these."""
x = 0.0
y = 0.0
deps = ["arrival:settled"]
tasks = [{ type = "item", item = "wands:iron_wand" }]
rewards = [{ type = "xp", amount = 50 }]

[[quest]]
slug = "chisel"
title = "A Chisel"
description = """
Rechiseled turns plain stone into a hundred patterns."""
x = 2.0
y = -1.0
deps = ["wand"]
tasks = [{ type = "item", item = "rechiseled:chisel" }]
rewards = [{ type = "xp", amount = 50 }]

[[quest]]
slug = "chests-and-drawers"
title = "Chests and Drawers for the House"
description = """
For the house itself, not the trading house: a sturdier chest and a drawer by the stove. The warehouse is still where goods belong."""
x = 4.0
y = 0.0
deps = ["chisel"]
optional = true
tasks = [{ type = "item", item = "sophisticatedstorage:chest" }, { type = "item", item = "functionalstorage:oak_1" }]
rewards = [{ type = "xp", amount = 50 }]
